[package]
name = "quadratix"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "gen_q3"
path = "src/hc/bin/gen_q3.rs"

[[bin]]
name = "gen_q4"
path = "src/hc/bin/gen_q4.rs"

[[bin]]
name = "gen_q5"
path = "src/hc/bin/gen_q5.rs"

[[bin]]
name = "gen_q6"
path = "src/hc/bin/gen_q6.rs"

[[bench]]
name = "hc_kernels"
harness = false

[[bench]]
name = "hofft_solver"
harness = false

[[bench]]
name = "hot_solver"
harness = false

[dependencies]
rustfft = "6.3.0"
nalgebra = "0.34.1"
rayon = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
