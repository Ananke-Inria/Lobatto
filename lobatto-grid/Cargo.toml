[package]
name = "lobatto-grid"
version = "0.1.9"
edition = "2021"
description = "Multi-element Gauss–Lobatto grids on tensor-product domains: geometry, boundary extensions, high-order Lagrange interpolation, and screened Poisson solvers (high-order FFT, dense fast diagonalisation); periodic directions may be equidistant trigonometric."
license = "LGPL-3.0-only"
repository = "https://github.com/Ananke-Inria/Lobatto/tree/main/lobatto-grid"
keywords = ["gauss-lobatto", "spectral-element", "interpolation", "poisson", "fft"]
categories = ["mathematics", "science"]

[features]
default = ["fft", "spectral"]
# High-order FFT (HoFFT) transforms and Poisson solvers (formerly lobatto-fft).
fft = ["dep:rustfft", "dep:nalgebra"]
# Poisson solvers by dense fast diagonalisation (formerly lobatto-spectral).
spectral = ["dep:nalgebra"]

[[bench]]
name = "interp"
harness = false

[[bench]]
name = "fft_solver"
harness = false
required-features = ["fft"]

[[bench]]
name = "spectral_solver"
harness = false
required-features = ["spectral"]

[[example]]
name = "fft_laplace_5d"
required-features = ["fft"]

[[example]]
name = "spectral_laplace_5d"
required-features = ["spectral"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "katex.html"]

[dependencies]
lobatto = "0.1.3"
nalgebra = { version = "0.34.1", optional = true }
rayon = "1"
realfft = "3.4"
rustfft = { version = "6.3.0", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
num-complex = "0.4"
