[package]
name = "lobatto-fft"
version = "0.3.1"
edition = "2021"
description = "High-order FFT on Gauss–Lobatto grids and corresponding high-order solver for Poisson problems."
license = "LGPL-3.0-only"
repository = "https://github.com/OndoMathX/QuadratiX/tree/main/lobatto-fft"
keywords = ["gauss-lobatto", "spectral-element", "poisson", "tensor-product", "fft"]
categories = ["mathematics", "science"]

[[bench]]
name = "solver"
harness = false

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex.html"]

[dependencies]
lobatto = "0.1.3"
lobatto-grid = "0.1.0"
nalgebra = "0.34.1"
rustfft = "6.3.0"
rayon = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
rayon = "1"
