[package]
name = "lobatto"
version = "0.1.1"
edition = "2021"
description = "Gauss–Lobatto quadrature and interpolation points, spectral finite-element lagrangian basis operations with efficient hardcoded versions for low order low dimensions cases."
license = "LGPL-3.0-only"
repository = "https://github.com/OndoMathX/QuadratiX/tree/main/lobatto"
keywords = ["quadrature", "gauss-lobatto", "spectral-element", "finite-element", "numerics"]
categories = ["mathematics", "science"]
exclude = ["src/bin/*"]

[[bench]]
name = "collocation_hc"
harness = false

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex.html"]

[dependencies]
nalgebra = "0.34.1"
rayon = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
