[package]
name = "lobatto-spectral"
version = "0.1.1"
edition = "2021"
description = "High-order screened Poisson solvers on Gauss-Lobatto grids."
license = "LGPL-3.0-only"
repository = "https://github.com/OndoMathX/QuadratiX/tree/main/lobatto-spectral"
keywords = ["gauss-lobatto", "spectral-element", "poisson", "tensor-product"]
categories = ["mathematics", "science"]

[[bench]]
name = "solver"
harness = false

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex.html"]

[dependencies]
lobatto = "0.1.1"
nalgebra = "0.34.1"
rustfft = "6.3.0"
rayon = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
rayon = "1"
